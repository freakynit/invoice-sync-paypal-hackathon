<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset password — Invoice Sync</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="topbar"><div class="wrap" style="display:flex;align-items:center;width:100%;">
<a class="brand" href="/"><img class="brand-mark" src="/logo.svg" width="30" height="30" alt="" /><span><span class="brand-name">Invoice Sync</span></span></a>
</div></header>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1>Choose a new password</h1>
    <p class="sub">Use at least 12 characters, up to 72 UTF-8 bytes.</p>
    <div class="form-err" id="err"></div>
    <div class="form-ok" id="ok"></div>
    <form id="f">
      <div class="field"><label class="lbl-field" for="pw">New password</label><input class="inp" id="pw" type="password" required minlength="12" placeholder="••••••••" /></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Update password</button>
    </form>
    <p class="auth-alt"><a href="/login">Back to login</a></p>
  </div>
</main>
<script type="module">
import { api, showFormError, showFormOk, redirectWithCountdown } from '/app.js';
const token = new URLSearchParams(window.location.search).get('token') || '';
if (!token) showFormError('err', 'No reset token in URL. Use the full link from your email.');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/auth/reset-password', { method: 'POST', body: { token, password: document.getElementById('pw').value } });
    showFormOk('ok', 'Password updated.');
    redirectWithCountdown('/login', { seconds: 5, targetId: 'ok', label: 'login' });
  } catch (err) { showFormError('err', err.message); }
});
</script>
</body>
</html>
