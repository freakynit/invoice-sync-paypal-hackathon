<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forgot password — Invoice Sync</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="topbar"><div class="wrap" style="display:flex;align-items:center;width:100%;">
<a class="brand" href="/"><img class="brand-mark" src="/logo.svg" width="30" height="30" alt="" /><span><span class="brand-name">Invoice Sync</span></span></a>
</div></header>
<main class="auth-wrap">
  <div class="card auth-card">
    <h1>Forgot password?</h1>
    <p class="sub">Enter your account email and we'll send a reset link.</p>
    <div class="form-err" id="err"></div>
    <div class="form-ok" id="ok"></div>
    <form id="f">
      <div class="field"><label class="lbl-field" for="email">Email</label><input class="inp" id="email" type="email" required placeholder="you@company.com" /></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit" id="btn">Send reset link</button>
    </form>
    <p class="auth-alt"><a href="/login">Back to login</a></p>
  </div>
</main>
<script type="module">
import { api, showFormError, showFormOk } from '/app.js';
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const d = await api('/api/auth/forgot-password', { method: 'POST', body: { email: document.getElementById('email').value } });
    showFormOk('ok', d.message);
  } catch (err) { showFormError('err', err.message); }
});
</script>
</body>
</html>
